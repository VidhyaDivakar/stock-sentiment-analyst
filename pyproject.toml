[project]
name = "stock-sentiment-analyst"
version = "0.1.0"
description = "Local AI stock news sentiment analyst (yfinance + Ollama + Streamlit)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.3",
    "streamlit>=1.64.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
